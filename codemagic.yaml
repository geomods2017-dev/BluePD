workflows:
  ios-workflow:
    name: iOS Build

    environment:
      xcode: latest
      groups:
        - Default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bluepd.app

    scripts:
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.bluepd.app" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"

      - name: Set up signing certificate
        script: |
          keychain initialize

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Verify Info.plist
        script: |
          /usr/libexec/PlistBuddy -c "Print" BluePD/BluePD/Info.plist

      - name: Set build version
        script: |
          BUILD_NUM=$(($PROJECT_BUILD_NUMBER + 101))
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 4.4" BluePD/BluePD/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" BluePD/BluePD/Info.plist
          echo "Using build number: $BUILD_NUM"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "BluePD/BluePD.xcodeproj" \
            --scheme "BluePD"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID